<section class="container py-4" style="max-width: 700px">
  <h1 class="h4 mb-4">{{ esEdicion ? 'Editar' : 'Nuevo' }} Usuario</h1>

  @if (error()) {
    <div class="alert alert-danger" role="alert">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="nombre">Nombre *</label>
        <input id="nombre" class="form-control" formControlName="nombre" />
      </div>

      <div class="col-md-6">
        <label class="form-label" for="apellido">Apellido *</label>
        <input id="apellido" class="form-control" formControlName="apellido" />
      </div>

      <div class="col-12">
        <label class="form-label" for="email">Email *</label>
        <input id="email" type="email" class="form-control" formControlName="email" />
      </div>

      @if (!esEdicion) {
        <div class="col-12">
          <label class="form-label" for="password">Contrasena *</label>
          <input id="password" type="password" class="form-control" formControlName="password" />
        </div>
      }

      <div class="col-md-6">
        <label class="form-label" for="tipo">Tipo *</label>
        <select id="tipo" class="form-select" formControlName="tipo">
          @for (tipo of tiposDisponibles; track tipo) {
            <option [value]="tipo">{{ tipo }}</option>
          }
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label" for="rolId">Rol *</label>
        <select id="rolId" class="form-select" formControlName="rolId">
          <option value="">-- Seleccionar --</option>
          @for (rol of roles(); track rol.id) {
            <option [value]="rol.id">{{ rol.nombre }}</option>
          }
        </select>
      </div>

      <div class="col-12">
        <label class="form-label" for="departamentos">Departamentos</label>
        <select id="departamentos" class="form-select" formControlName="departamentosIds" multiple>
          @for (depto of departamentos(); track depto.id) {
            <option [value]="depto.id">{{ depto.codigo }} - {{ depto.nombre }}</option>
          }
        </select>
      </div>

      @if (esEdicion) {
        <div class="col-12">
          <div class="form-check">
            <input id="activo" class="form-check-input" type="checkbox" formControlName="activo" />
            <label class="form-check-label" for="activo">Usuario activo</label>
          </div>
        </div>
      }
    </div>

    <div class="mt-4 d-flex gap-2">
      <button type="submit" class="btn btn-primary" [disabled]="loading() || form.invalid">
        @if (loading()) {
          <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
        }
        {{ esEdicion ? 'Actualizar' : 'Crear' }}
      </button>
      <a class="btn btn-secondary" routerLink="/admin/usuarios">Cancelar</a>
    </div>
  </form>
</section>
